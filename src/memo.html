<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome Simple Memo</title>
    <link rel="stylesheet" href="memo.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="sidebar-header">
          <button
            class="settings-btn"
            aria-label="設定"
            title="設定"
            aria-expanded="false"
          >
            ☰
          </button>
          <div class="sidebar-title">SimpleNote</div>
          <button
            class="help-btn"
            aria-label="ヘルプ"
            title="ヘルプ"
            aria-expanded="false"
          >
            ?
          </button>
          <input
            type="file"
            class="import-input"
            accept=".json,application/json"
            multiple
            hidden
          />
          <button
            class="sidebar-toggle sidebar-close"
            aria-label="サイドバーを閉じる"
            title="サイドバーを閉じる"
            aria-expanded="true"
          >
            «
          </button>
        </div>
        <button class="new-memo-btn" title="新しいメモを作る">
          ＋ 新しいメモ
        </button>
        <button class="secret-memo-btn" title="タブを閉じると消えるメモを作る">
          🔒 シークレットメモ
        </button>
        <input type="text" class="search-input" placeholder="メモを検索..." />
        <div class="memo-list">
          <!-- メモリストがここに表示されます -->
        </div>
      </div>
      <div class="sidebar-resizer"></div>
      <div class="main-content">
        <div class="secret-label" hidden>
          🔒 シークレットメモ（タブを閉じると消えます）
        </div>
        <div class="log-message"></div>
        <div class="settings-panel" hidden>
          <div class="settings-header">
            <div class="settings-title">設定</div>
            <button class="settings-close-btn" title="設定を閉じる">
              閉じる
            </button>
          </div>
          <section class="settings-section">
            <h2>データ</h2>
            <div class="settings-row">
              <button
                class="export-btn"
                title="通常メモを JSON ファイルに書き出す"
              >
                エクスポート
              </button>
              <button
                class="import-btn"
                title="JSON ファイルからメモを追加する"
              >
                インポート
              </button>
              <button
                class="delete-all-btn"
                title="通常メモをすべて削除する（シークレットメモは残る）"
              >
                全メモ削除
              </button>
            </div>
            <p class="settings-hint">
              JSON ファイルをこの画面にドラッグ＆ドロップしても取り込めます
            </p>
          </section>
          <section class="settings-section">
            <h2>自動保存</h2>
            <div class="settings-kind">
              <div class="settings-kind-title">通常メモ</div>
              <label class="settings-row">
                <input type="checkbox" class="normal-auto-save-input" />
                入力が止まったら自動で保存する
              </label>
              <label class="settings-row">
                保存までの時間
                <select class="normal-auto-save-delay-input">
                  <option value="500">0.5秒</option>
                  <option value="1000">1秒</option>
                  <option value="2000">2秒</option>
                  <option value="3000">3秒</option>
                  <option value="5000">5秒</option>
                </select>
              </label>
            </div>
            <div class="settings-kind">
              <div class="settings-kind-title">シークレットメモ</div>
              <label class="settings-row">
                <input type="checkbox" class="secret-auto-save-input" />
                入力が止まったら自動で保存する
              </label>
              <label class="settings-row">
                保存までの時間
                <select class="secret-auto-save-delay-input">
                  <option value="500">0.5秒</option>
                  <option value="1000">1秒</option>
                  <option value="2000">2秒</option>
                  <option value="3000">3秒</option>
                  <option value="5000">5秒</option>
                </select>
              </label>
            </div>
          </section>
          <section class="settings-section">
            <h2>削除の確認</h2>
            <label class="settings-row">
              <input type="checkbox" class="normal-confirm-delete-input" />
              通常メモを削除する前に確認する
            </label>
            <label class="settings-row">
              <input type="checkbox" class="secret-confirm-delete-input" />
              シークレットメモを削除する前に確認する
            </label>
          </section>
          <section class="settings-section">
            <h2>表示</h2>
            <label class="settings-row">
              文字サイズ
              <select class="font-size-input">
                <option value="12">12px</option>
                <option value="14">14px</option>
                <option value="16">16px</option>
                <option value="18">18px</option>
                <option value="20">20px</option>
                <option value="24">24px</option>
              </select>
            </label>
            <label class="settings-row">
              タイトルの文字数
              <select class="title-length-input">
                <option value="10">10文字</option>
                <option value="20">20文字</option>
                <option value="30">30文字</option>
                <option value="40">40文字</option>
                <option value="50">50文字</option>
                <option value="75">75文字</option>
                <option value="100">100文字</option>
              </select>
            </label>
            <label class="settings-row">
              テーマ
              <select class="theme-input">
                <option value="light">ライト</option>
                <option value="dark">ダーク</option>
              </select>
            </label>
          </section>
        </div>
        <div class="help-panel" hidden>
          <div class="settings-header">
            <div class="settings-title">ヘルプ</div>
            <button
              class="help-close-btn settings-close-btn"
              title="ヘルプを閉じる"
            >
              閉じる
            </button>
          </div>
          <section class="settings-section">
            <h2>キーボードショートカット</h2>
            <div class="shortcut-list"></div>
          </section>
          <section class="settings-section">
            <h2>バージョン</h2>
            <p class="help-version"></p>
          </section>
        </div>
        <div class="main-header">
          <button
            class="sidebar-toggle sidebar-open"
            aria-label="サイドバーを開く"
            title="サイドバーを開く"
            aria-expanded="true"
          >
            »
          </button>
          <div class="title-display" title="クリックしてタイトルを変更">
            新しいメモ
          </div>
          <input
            type="text"
            class="title-input"
            maxlength="100"
            aria-label="タイトル"
            hidden
          />
          <button class="delete-btn" title="このメモを削除する">削除</button>
          <button class="copy-btn" title="本文をコピーする">コピー</button>
          <button class="save-btn" title="このメモを保存する">保存</button>
        </div>
        <div class="editor">
          <pre class="editor-highlight" aria-hidden="true"></pre>
          <textarea
            class="content-input"
            placeholder="メモの内容を入力してください..."
          ></textarea>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
