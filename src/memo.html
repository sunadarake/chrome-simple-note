<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome Simple Memo</title>
    <link rel="stylesheet" href="memo.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-menu-wrap">
            <button
              class="sidebar-menu-btn"
              aria-label="メニュー"
              aria-expanded="false"
            >
              ☰
            </button>
            <div class="sidebar-menu" hidden>
              <button class="export-btn">エクスポート</button>
              <button class="import-btn">インポート</button>
            </div>
          </div>
          <div class="sidebar-title">SimpleNote</div>
          <input
            type="file"
            class="import-input"
            accept=".json,application/json"
            hidden
          />
          <button
            class="sidebar-toggle sidebar-close"
            aria-label="サイドバーを閉じる"
            aria-expanded="true"
          >
            «
          </button>
        </div>
        <button class="new-memo-btn">＋ 新しいメモ</button>
        <button class="secret-memo-btn">🔒 シークレットメモ</button>
        <input type="text" class="search-input" placeholder="メモを検索..." />
        <div class="memo-list">
          <!-- メモリストがここに表示されます -->
        </div>
      </div>
      <div class="sidebar-resizer"></div>
      <div class="main-content">
        <div class="secret-label" hidden>
          🔒 シークレットメモ（タブを閉じると消えます）
        </div>
        <div class="main-header">
          <button
            class="sidebar-toggle sidebar-open"
            aria-label="サイドバーを開く"
            aria-expanded="true"
          >
            »
          </button>
          <div class="title-display">新しいメモ</div>
          <button class="delete-btn">削除</button>
          <button class="copy-btn">コピー</button>
          <button class="save-btn">保存</button>
        </div>
        <div class="editor">
          <pre class="editor-highlight" aria-hidden="true"></pre>
          <textarea
            class="content-input"
            placeholder="メモの内容を入力してください..."
          ></textarea>
          <div class="log-message"></div>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
